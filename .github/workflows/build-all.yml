name: Build Android APK & iOS Tweak/IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      ipa_url:
        description: '(선택) 패치할 순정 YouTube.ipa 다운로드 URL'
        required: false
        default: ''

jobs:
  build-android-apk:
    name: Build Android Companion APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug & Release APK
        working-directory: ./android
        run: gradle assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeShortsAutoScroll-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk

  build-ios-tweak:
    name: Build iOS Tweak (.deb / .dylib) & Patched IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos & cyan (IPA injector)
        run: |
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C $HOME/theos/sdks --strip-components=1
          pip3 install --break-system-packages https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip || true

      - name: Compile YouTubeAutoShorts.dylib & .deb
        working-directory: ./ios-tweak
        env:
          THEOS: ${{ runner.os == 'macOS' && format('{0}/theos', env.HOME) || '' }}
        run: |
          make clean && make package FINALPACKAGE=1

      - name: Inject into YouTube.ipa (if URL provided)
        if: ${{ github.event.inputs.ipa_url != '' }}
        working-directory: ./ios-tweak
        run: |
          curl -L "${{ github.event.inputs.ipa_url }}" -o YouTube.ipa
          ./build-ipa.sh YouTube.ipa YouTube-AutoShorts.ipa

      - name: Upload iOS Artifacts (.deb, .dylib, .ipa)
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeAutoShorts-iOS-Package
          path: |
            ios-tweak/packages/*.deb
            ios-tweak/.theos/obj/*.dylib
            ios-tweak/YouTube-AutoShorts.ipa

