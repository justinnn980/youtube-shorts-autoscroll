<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shorts 자동 넘김 설정</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      background: #0f0f0f;
      color: #f1f1f1;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Roboto", sans-serif;
      padding: 18px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .yt-badge {
      width: 28px;
      height: 20px;
      background: #ff0033;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .yt-badge::after {
      content: "";
      border-style: solid;
      border-width: 4px 0 4px 7px;
      border-color: transparent transparent transparent #fff;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
    }
    .card {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 6px 14px;
      border: 1px solid #272727;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      gap: 12px;
    }
    .row + .row {
      border-top: 1px solid #272727;
    }
    .row-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .row-sub {
      font-size: 12px;
      color: #aaaaaa;
      line-height: 1.35;
    }
    .switch {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #3f3f3f;
      transition: 0.2s;
      border-radius: 24px;
    }
    .slider::before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: #ffffff;
      transition: 0.2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #3ea6ff;
    }
    input:checked + .slider::before {
      transform: translateX(20px);
    }
    .note {
      margin-top: 12px;
      font-size: 11.5px;
      color: #888;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="yt-badge"></div>
    <h1>Shorts 자동 넘김 설정</h1>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <div class="row-title">쇼츠 자동 넘김</div>
        <div class="row-sub">영상이 끝까지 재생되면 반복 재생 대신 다음 쇼츠로 자동 이동합니다.</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleAutoScroll" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <div>
        <div class="row-title">댓글·설명창 열람 시 일시정지</div>
        <div class="row-sub">댓글창을 열어둔 동안에는 영상이 끝나도 넘어가지 않습니다.</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="togglePauseComments" checked />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <p class="note">
    • 유튜브 화면을 가리는 별도의 플로팅 버튼을 표시하지 않으며, 설정에서만 깔끔하게 켜고 끌 수 있습니다.
  </p>

  <script src="popup.js"></script>
</body>
</html>
